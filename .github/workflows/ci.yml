name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and install package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Check source-distribution support files
        run: >-
          python -c "import glob, tarfile;
          archive = glob.glob('dist/*.tar.gz');
          assert len(archive) == 1, archive;
          names = tarfile.open(archive[0]).getnames();
          required = ('docs/lab_setup_guide.md',
          'examples/study_manifest.yaml',
          'scripts/track_people_in_video.py');
          missing = [item for item in required if not any(name.endswith('/' +
          item) for name in names)]; assert not missing, missing"

      - name: Install and smoke-test the wheel outside the checkout
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          python -c "from importlib.resources import files; import naturallab; print(naturallab.__file__); assert (files('naturallab.config.presets') / 'qwen36_27b_quality.yaml').is_file()"
          naturallab --version
          naturallab doctor --profile core

  hardware-free-tests:
    name: Hardware-free tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      NATURALLAB_REID_SMOKE_MODEL: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install tested package profiles
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.9.1" "torchvision==0.24.1"
          python -m pip install ".[gaze,qwen,dev]"

      - name: Run tests without hardware or model downloads
        run: python -m pytest -q

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        run: python -m pip install "ruff>=0.5.0"

      - name: Check Python source tree
        run: ruff check naturallab scripts tests
